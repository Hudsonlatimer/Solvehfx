name: Keep Supabase warm

# Pings the SolveHFX health endpoint on a schedule so the (free-tier) Supabase
# project never auto-pauses. A warm DB means fast first page loads.
#
# Setup: optionally add a repo secret HEALTH_URL pointing at your deployed
# health endpoint (e.g. https://your-domain/api/health). If unset it defaults
# to https://solvehfx.ca/api/health.

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes (GitHub's minimum interval)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ secrets.HEALTH_URL || 'https://solvehfx.ca/api/health' }}"
          echo "Pinging $URL"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
            echo "Attempt $attempt → HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 3 attempts (last code: $code)."
          exit 1

name: Keep Supabase warm

# Pings the SolveHFX health endpoint on a schedule so the (free-tier) Supabase
# project doesn't auto-pause after ~7 days of inactivity. A warm DB means fast
# page loads instead of a multi-second cold start.
#
# Setup: if the site is deployed somewhere other than https://solvehfx.ca, add a
# repo secret HEALTH_URL pointing at your deployed health endpoint, e.g.
# https://your-app.vercel.app/api/health (Settings -> Secrets and variables ->
# Actions). The job does NOT fail when the site is unreachable — it just logs a
# warning — so it won't spam failure emails before the site is live.

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours — plenty to beat the 7-day pause window
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ secrets.HEALTH_URL || 'https://solvehfx.ca/api/health' }}"
          echo "Pinging $URL"
          # 45s headroom: a ping that wakes a paused DB can take 20-30s, and
          # that's exactly the ping we don't want to cut short.
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 45 "$URL" || echo "000")
          echo "HTTP $code"
          if [ "$code" = "200" ]; then
            echo "✅ Supabase pinged — project kept warm."
          else
            echo "::warning title=Keep-alive ping::Health endpoint returned $code. The site may not be deployed yet, or HEALTH_URL is unset/incorrect. Not failing the job."
          fi
